name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Surface build errors
        if: failure()
        run: |
          {
            grep -A14 "No matching variant" build.log | cut -c1-300 | head -40
            grep -nE "error:|warning: \[|FAILED|What went wrong|Could not|Caused by|^\s+symbol:|^\s+location:" build.log | head -60
            echo "--- tail ---"
            tail -n 40 build.log
          } | head -c 30000 > summary.txt
          MSG=$(python3 -c "import sys,urllib.parse;print(open('summary.txt').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=build log::$MSG"

      - name: Verify JAR
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          {
            echo "JAR: $JAR"
            unzip -l "$JAR" | awk '{print $4}' | grep -vE '^$|Name|----'
            echo "--- fabric.mod.json"
            unzip -p "$JAR" fabric.mod.json
          } > jar.txt
          MSG=$(python3 -c "print(open('jar.txt').read().replace('%','%25').replace('\\r','%0D').replace('\\n','%0A'))")
          echo "::notice title=jar contents::$MSG"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: smoothminer-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
