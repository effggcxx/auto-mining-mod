name: inspect-api

on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Space-separated fully-qualified class names to javap"
        required: true
      filter:
        description: "Optional egrep filter on member lines"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve jars
        run: ./gradlew build --stacktrace -q || true
      - name: Dump
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          MM=$(find ~/.gradle -name 'modmenu-*.jar' ! -name '*sources*' | head -1)
          FA=$(find ~/.gradle -name 'fabric-*.jar' ! -name '*sources*' | tr '\n' ':')
          CP="$MC:$MM:$FA"
          {
            echo "MC=$MC"; echo "MM=$MM"
            for c in ${{ github.event.inputs.classes }}; do
              echo "=== $c"
              if [ -n "${{ github.event.inputs.filter }}" ]; then
                javap -cp "$CP" -protected "$c" 2>&1 | grep -E "${{ github.event.inputs.filter }}|===|Error" | sed 's/^ *//'
              else
                javap -cp "$CP" -protected "$c" 2>&1 | sed 's/^ *//'
              fi
            done
          } > api.txt
          MSG=$(python3 -c "print(open('api.txt').read()[:60000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=api dump::$MSG"
